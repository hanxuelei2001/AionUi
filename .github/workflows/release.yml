name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            os: macos-14
            command: bun run build-mac:arm64
          - platform: macos
            arch: x64
            os: macos-14
            command: bun run build-mac:x64
          - platform: windows
            arch: x64
            os: windows-2022
            command: bun run build-win:x64
          - platform: windows
            arch: arm64
            os: windows-11-arm
            command: bun run build-win:arm64
          - platform: linux
            arch: x64
            os: ubuntu-latest
            command: bun run build-deb
          - platform: linux
            arch: arm64
            os: ubuntu-24.04-arm
            command: bun run build-deb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Linux-specific dependencies
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      # Cache Electron / Electron-Builder artifacts
      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      # Windows-specific build tool setup
      - name: Setup MSBuild (Windows only)
        if: matrix.platform == 'windows'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Setup Windows build environment (Windows only)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Rebuild native modules (Windows only)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          try {
            bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force
          } catch {
            Write-Host "prebuild-install fallback to electron-rebuild"
            bunx electron-rebuild -f -w better-sqlite3
          }

      # Non-Windows native modules setup
      - name: Rebuild native modules for Electron (macOS/Linux)
        if: matrix.platform != 'windows'
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      # macOS: Clean up stale disk images before packaging
      - name: Clean up disk images (macOS only)
        if: matrix.platform == 'macos'
        run: |
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          rm -f /tmp/*.dmg 2>/dev/null || true

      # Execute packaging script from package.json
      - name: Build package (${{ matrix.command }})
        shell: bash
        run: ${{ matrix.command }}
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=8192'
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      # Upload artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/*.dmg
            out/*.exe
            out/*.deb
            out/*.zip
            out/*.yml
          if-no-files-found: warn
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Release Tag from package.json
        id: release_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${VERSION}"
          echo "Resolved release tag: ${TAG_NAME}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded release assets
        shell: bash
        run: |
          echo "Downloaded assets:"
          find release-artifacts -type f

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.tag_name }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.zip
            release-artifacts/**/*.yml
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.release_info.outputs.version, 'beta') || contains(steps.release_info.outputs.version, 'alpha') || contains(steps.release_info.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
